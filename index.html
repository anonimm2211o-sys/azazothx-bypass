<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azazothx Bypass</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="glow-top"></div>
      <div class="glow-bottom"></div>

      <header>
        <h1 class="title">Azazothx<span class="accent">Bypass</span></h1>
        <p class="subtitle">Shortlink bypass — no ads, no wait</p>
      </header>

      <div class="input-wrap">
        <input
          id="urlInput"
          type="url"
          placeholder="Paste shortlink here..."
          autocomplete="off"
          spellcheck="false"
        />
        <button id="bypassBtn">Bypass</button>
      </div>

      <div id="result" class="result hidden"></div>

      <div id="spinner" class="spinner hidden"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
